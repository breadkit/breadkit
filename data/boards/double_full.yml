id: double_full
name: Double full-size breadboard (1660 tie points)
terminal:
  columns: 126
  rows: [a, b, c, d, e, f, g, h, i, j]
  groups: [[a, b, c, d, e], [f, g, h, i, j]]
  ravine_between: [e, f]
rails:
  - {id: "T+", side: top, order: 0}
  - {id: "T-", side: top, order: 1}
  - {id: "B+", side: bottom, order: 1}
  - {id: "B-", side: bottom, order: 0}
rail_layout:
  holes: 100
  group_size: 5
  start_column: 3
  segments: [[1, 50], [51, 100]]
  split_segments: [[1, 25], [26, 50], [51, 75], [76, 100]]
