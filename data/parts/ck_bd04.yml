  - {num: P1B, type: passive}
  - {num: P2A, type: passive}
  - {num: P2B, type: passive}
  - {num: P3A, type: passive}
  - {num: P3B, type: passive}
  - {num: P4A, type: passive}
  - {num: P4B, type: passive}
