name: Nightly integration

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: breadkit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breadkit/breadkit-lint
          ref: main
          path: breadkit-lint
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breadkit/breadkit-render
          ref: main
          path: breadkit-render
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breadkit/breadkit-rspec
          ref: main
          path: breadkit-rspec
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: breadkit/breadkit-parts
          ref: main
          path: breadkit-parts
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin libvips-dev fonts-noto-cjk
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
          bundler: default
      - name: Core suite
        working-directory: breadkit
        run: bundle install && bundle exec rake
      - name: Part pack pinout and placement
        working-directory: breadkit
        run: |
          ruby ../breadkit-parts/test/pico_w_test.rb
          bundle exec ruby -Ilib ../breadkit-parts/test/placement_test.rb
          for file in ../breadkit-parts/parts/*.yml; do
            bundle exec breadkit check-part "$file"
          done
      - name: Lint suite
        working-directory: breadkit-lint
        run: bundle install && bundle exec rake
      - name: Render suite
        working-directory: breadkit-render
        run: bundle install && bundle exec rake
      - name: RSpec matcher suite
        working-directory: breadkit-rspec
        run: bundle install && bundle exec rake
      - name: RSpec matcher on shared example
        working-directory: breadkit-rspec
        run: |
          bundle exec ruby -Ilib -rbreadkit/rspec -e '
            include RSpec::Matchers
            circuit = Breadkit.load("../breadkit/examples/01_led_button.bk.rb")
            expect(circuit).to connect("R1.2", "D1.anode")
          '
      - name: Full-board performance benchmark
        working-directory: breadkit
        run: ruby -Ilib -I../breadkit-lint/lib -I../breadkit-render/lib scripts/benchmark.rb
      - name: MCP draft resolve, lint, and render
        working-directory: breadkit
        run: ruby -Ilib -I../breadkit-lint/lib -I../breadkit-render/lib scripts/check_mcp_draft.rb
      - name: Lint shared examples
        working-directory: breadkit-lint
        run: bundle exec bklint ../breadkit/examples/*.bk.rb
      - name: Render shared examples
        working-directory: breadkit-render
        run: |
          mkdir -p /tmp/breadkit-integration
          for file in ../breadkit/examples/*.bk.rb; do
            name="${file##*/}"
            bundle exec bkrender "$file" -o "/tmp/breadkit-integration/${name%.bk.rb}.png"
          done
          bundle exec bkrender ../breadkit/examples/01_led_button.bk.rb \
            --print-template -o /tmp/breadkit-integration/board.pdf
