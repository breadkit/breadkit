name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    if: ${{ vars.RUBYGEMS_TRUSTED_PUBLISHING == 'enabled' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Verify tag matches gem version
        run: test "v$(ruby -e 'require_relative "lib/breadkit/version"; print Breadkit::VERSION')" = "$GITHUB_REF_NAME"
      - name: Configure RubyGems Trusted Publishing
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Build and push breadkit
        run: gem build breadkit.gemspec && gem push "breadkit-${GITHUB_REF_NAME#v}.gem"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
