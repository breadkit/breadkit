name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.gem }} / Ruby ${{ matrix.ruby }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.3", "3.4", "4.0"]
        gem: [breadkit, breadkit-render, breadkit-lint]
        include:
          - os: macos-latest
            ruby: "4.0"
            gem: breadkit-render
    defaults:
      run:
        working-directory: ${{ matrix.gem }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install rasterizer (Linux)
        if: matrix.gem == 'breadkit-render' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin libvips-dev fonts-noto-cjk
      - name: Install rasterizer (macOS)
        if: matrix.gem == 'breadkit-render' && runner.os == 'macOS'
        run: brew install librsvg vips
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: ${{ matrix.gem }}
      - run: bundle exec rake

  examples:
    name: Examples (lint and render)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin fonts-noto-cjk
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: false
      - name: Build and install gems locally
        run: |
          for gem in breadkit breadkit-render breadkit-lint; do
            (cd "$gem" && gem build "$gem.gemspec" && gem install --local "./$gem-$(cat ../VERSION).gem")
          done
      - name: Lint valid examples
        run: bklint examples/*.bk.rb
      - name: Check expected offenses
        run: ruby scripts/check_bad_examples.rb
      - name: Render examples
        run: |
          mkdir -p out
          for file in examples/*.bk.rb; do
            name="${file##*/}"
            bkrender "$file" -o "out/${name%.bk.rb}.png" --scale 2
          done
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-examples
          path: out/
